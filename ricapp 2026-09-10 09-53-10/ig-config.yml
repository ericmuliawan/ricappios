# KUNCI UTAMA MANDATORI
protection:
  # Masukkan opsi obfuscation/RASP di sini
  enabled: true
  names:
    enabled: true
    obfuscate-symbols: true
  arithmetic-operations:
    enabled: true
    allowlists: # Allowlists are necessary for arithmetic obfuscation
        # Level can be low | medium | high
        - level: medium
          structured-allowlist:
            interfaces:
              - name: ".*"
                instancemethods:
                  - name: "foo"
          allowlist:
            - "foo.*"
            - "bar.*"
        - level: high
          allowlist:
            - "PasswordDecryptionFn"
  code-integrity: 
    enabled: true
    objc-calls:
      enabled: true  
    functions:
      enabled: true
    tracing:
      enabled: true
    system-library:
      enabled: true
  control-flow:
    enabled: true
    logic:
      enabled: true
      allowlists: # Allowlists are necessary for control-flow
          # Level can be low | medium | high
          - level: medium
            structured-allowlist:
              interfaces:
              - name: ".*"
                instancemethods:
                - name: "foo"
            allowlist:
              - "foo.*"
              - "bar.*"
          - level: high
            allowlist:
              - "PasswordDecryptionFn"
    calls:
      enabled: true
  environment-integrity:
    enabled: true
    debugger:
      enabled: true
      callback: "my_callback"
    emulator:
      enabled: true
      continue-on-callback: false
      callback: "my_callback"
    jailbreak:
      enabled: true
      continue-on-callback: false
      callback: "my_callback"
    touch-simulation:
      enabled: true
      callback: "my_callback"
    memory-access:
      enabled: true
      callback: "my_callback"
    clock-rate:
      enabled: true
      callback: "my_callback"
  data:
    enabled: true
    # Defines strings that must be encrypted
    allowlist:
      - "license(.*)"
      - "(.*)key"
    # Defines functions where strings must be encrypted
    location-structured-allowlist:
      interfaces:
        - name: "baz"
          instancemethods:
            - name: "instanceMethodNameOrRegex"
          classmethods:
            - name: "classMethodNameOrRegex"
    location-allowlist:
        - "fullFunctionNameOrRegex"
  app-integrity:
    enabled: false
  resources:
    enabled: true 

monitor:
  threatcast-key: ""
  
